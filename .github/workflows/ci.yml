name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  quality:
    name: Lint and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Sin `version`: la toma del campo `packageManager` de package.json, que
      # es donde ya vivia. Declararla en los dos sitios hace que las versiones
      # nuevas de la accion aborten con "Multiple versions of pnpm specified".
      - name: Configure pnpm
        uses: pnpm/action-setup@v6

      - name: Configure Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm check

  deploy:
    name: Deploy to GitHub Pages
    # Solo la rama principal se publica, y solo si la verificacion pasa: un
    # enlace roto en el escaparate es peor que no tener enlace.
    needs: quality
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Sin `version`: la toma del campo `packageManager` de package.json, que
      # es donde ya vivia. Declararla en los dos sitios hace que las versiones
      # nuevas de la accion aborten con "Multiple versions of pnpm specified".
      - name: Configure pnpm
        uses: pnpm/action-setup@v6

      - name: Configure Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # El sitio de Pages se crea una sola vez desde los ajustes del
      # repositorio (Settings -> Pages -> Source: GitHub Actions). No se puede
      # automatizar aqui: el parametro `enablement` de esta accion crea el
      # sitio por API y eso exige `Administration: write`, un permiso que el
      # GITHUB_TOKEN de un flujo no puede declarar —solo llega a `pages:
      # write`, que publica pero no crea—. Probado: falla con "Resource not
      # accessible by integration".
      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
