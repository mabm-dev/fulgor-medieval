name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secretos:
    name: Comprobar los secretos de Unity
    runs-on: ubuntu-latest
    outputs:
      disponible: ${{ steps.comprobar.outputs.disponible }}
    steps:
      - name: Buscar UNITY_LICENSE, UNITY_EMAIL y UNITY_PASSWORD
        id: comprobar
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          faltan=""
          [ -n "$UNITY_LICENSE" ] || faltan="$faltan UNITY_LICENSE"
          [ -n "$UNITY_EMAIL" ] || faltan="$faltan UNITY_EMAIL"
          [ -n "$UNITY_PASSWORD" ] || faltan="$faltan UNITY_PASSWORD"
          if [ -z "$faltan" ]; then
            echo "disponible=true" >> "$GITHUB_OUTPUT"
          else
            echo "disponible=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Pruebas omitidas::Faltan secretos de Unity:$faltan. Consulta CONTRIBUTING.md para activar las pruebas Edit Mode."
          fi

  pruebas:
    name: Pruebas Edit Mode
    needs: secretos
    if: needs.secretos.outputs.disponible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Caché de Library
        uses: actions/cache@v6
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: Ejecutar las pruebas
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Resultados Edit Mode

      - name: Guardar los resultados
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: resultados-edit-mode
          path: artifacts
